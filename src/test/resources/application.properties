spring.application.name=SwiftBid-Test

# In-memory H2 in MySQL-compatibility mode so entity mappings (TEXT columns, etc.) behave close
# enough to the real MySQL schema without requiring a running MySQL/Docker instance in CI/sandbox.
spring.datasource.url=jdbc:h2:mem:swiftbid_test_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=test-only-secret-key-for-swiftbid-integration-tests
jwt.expiration-ms=3600000

file.upload-dir=build/test-uploads
app.base-url=
app.frontend-url=http://localhost:3000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# Scheduler is disabled in tests: state transitions are driven explicitly (see AuctionServiceTest).
auction.status-scheduler.enabled=false
