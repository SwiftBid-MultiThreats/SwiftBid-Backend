spring.application.name=SwiftBid

spring.datasource.url=jdbc:mysql://localhost:3306/swiftbid_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# --- JWT (FR-AUTH-06) --- override jwt.secret via env var in any real deployment.
jwt.secret=${JWT_SECRET:change-this-super-secret-key-for-swiftbid-please-override-in-prod}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- File uploads (FR-PROD-01, FR-AUC-01, FR-USER-03) ---
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
# Prefix for URLs returned to clients, e.g. https://api.swiftbid.example — leave empty for relative URLs.
app.base-url=${APP_BASE_URL:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Frontend base URL, used to build password-reset links (FR-AUTH-04) ---
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# --- Mail (FR-NOTIF-01) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Scheduler (FR-AUC-06) ---
auction.status-scheduler.fixed-rate-ms=60000